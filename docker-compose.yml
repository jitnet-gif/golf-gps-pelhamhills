version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bepu_postgres
    environment:
      POSTGRES_USER: bepu
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bepu_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bepu_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
